<!DOCTYPE html>
<html>

<head>
	<title>添加新闻</title>
	<meta charset="UTF-8">
	<!-- 引入外部样式 -->
	<link href="https://lf26-cdn-tos.bytecdntp.com/cdn/expire-1-M/bootstrap/5.1.3/css/bootstrap.min.css"
		rel="stylesheet">
</head>

<body>
	<!-- 主容器 -->
	<div class="container mt-4">
		<h1>添加新闻</h1>

		<!-- 新闻表单 -->
		<form id="newsForm" class="mt-4">
			<!-- 标题输入 -->
			<div class="mb-3">
				<label for="title" class="form-label">标题</label>
				<input type="text" class="form-control" id="title" name="title" required>
			</div>

			<!-- 作者输入 -->
			<div class="mb-3">
				<label for="author" class="form-label">作者</label>
				<input type="text" class="form-control" id="author" name="author" required>
			</div>

			<!-- 内容输入 -->
			<div class="mb-3">
				<label for="content" class="form-label">内容</label>
				<textarea class="form-control" id="content" name="content" rows="10" required></textarea>
			</div>

			<!-- 图片上传 -->
			<div class="mb-3">
				<label for="image" class="form-label">图片</label>
				<input type="file" class="form-control" id="image" name="file" accept="image/*">
			</div>

			<!-- 提交与返回按钮 -->
			<div class="mb-3">
				<button type="submit" class="btn btn-primary">提交</button>
				<a href="/news/manage" class="btn btn-secondary">返回</a>
			</div>
		</form>
	</div>

	<script>
		// 监听表单修改
		document.getElementById('newsForm').addEventListener('submit', function (e) {
			e.preventDefault();

			// 创建表单
			const formData = new FormData();
			formData.append('title', document.getElementById('title').value);
			formData.append('author', document.getElementById('author').value);
			formData.append('content', document.getElementById('content').value);

			// 处理图片文件
			const imageFile = document.getElementById('image').files[0];
			if (imageFile) {
				formData.append('file', imageFile);
			}

			// 发送请求
			fetch('/news/upload', {
				method: 'POST',
				body: formData
			})
				.then(response => {
					if (!response.ok) {
						throw new Error('Network response was not ok');
					}
					return response.text();
				})
				.then(result => {
					// 处理响应结果
					alert(result);
					if (result.includes('成功')) {
						window.location.href = '/news/manage';
					}
				})
				.catch(error => {
					// 错误处理
					console.error('Error:', error);
					alert('添加失败：' + error);
				});
		});
	</script>
</body>

</html>
