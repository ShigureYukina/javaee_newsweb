<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title th:text="${news.title}">新闻详情</title>
	<link href="https://lf26-cdn-tos.bytecdntp.com/cdn/expire-1-M/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
	<style>
	.news-image {
		max-height: 400px;
		width: 100%;
		object-fit: contain;
	}
	</style>
</head>

<body>
	<div class="container mt-4">
		<div class="mb-3">
			<a href="/news/list" class="btn btn-secondary">返回列表</a>
			<a href="/news/manage" class="btn btn-primary">返回管理</a>
		</div>

		<article class="mt-4">
			<h1 class="mb-4" th:text="${news.title}">新闻标题</h1>
			
			<div class="text-muted mb-4">
				<small th:text="${#dates.format(news.createTime, 'yyyy-MM-dd HH:mm')}">发布时间</small>
			</div>
			
			<div th:if="${news.imageUrl}" class="mb-4">
				<img th:src="@{'/' + ${news.imageUrl}}" 
					 th:alt="${news.title + '的图片'}"
					 th:title="${news.title}"
					 class="img-fluid rounded">
			</div>
			
			<div class="news-content">
				<p th:text="${news.content}" style="white-space: pre-line;">新闻内容</p>
			</div>
		</article>
	</div>
</body>

</html>
