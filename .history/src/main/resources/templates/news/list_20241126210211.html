<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>新闻列表</title>
	<link href="https://lf26-cdn-tos.bytecdntp.com/cdn/expire-1-M/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
	<style>
	.card-img-top {
		height: 200px;
		overflow: hidden;
		background-color: #f8f9fa;
		display: flex;
		align-items: center;
		justify-content: center;
	}
	.card-img-top img {
		width: 100%;
		height: 100%;
		object-fit: cover;
	}
	.placeholder-text {
		color: #6c757d;
		font-size: 1.2rem;
	}
	</style>
</head>

<body>
	<div class="container mt-4">
		<h1>新闻列表</h1>
		
		<div class="mb-3">
			<a href="/news/manage" class="btn btn-primary">返回管理</a>
		</div>
		
		<div class="row">
			<div th:each="news : ${newsList}" class="col-md-6 mb-4">
				<div class="card">
					<div th:if="${news.imageUrl}" class="card-img-top">
						<img th:src="@{'/' + ${news.imageUrl}}" 
							 th:alt="${news.title}" 
							 class="img-fluid">
					</div>
					<div class="card-body">
						<h5 class="card-title" th:text="${news.title}">标题</h5>
						<p class="card-text text-muted" 
						   th:text="${#dates.format(news.createTime, 'yyyy-MM-dd HH:mm')}">
							时间
						</p>
						<a th:href="@{'/news/view/' + ${news.id}}" 
						   class="btn btn-primary">查看详情</a>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
