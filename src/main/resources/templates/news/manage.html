<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>新闻管理</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- 引入外部样式 -->
	<link href="https://lf26-cdn-tos.bytecdntp.com/cdn/expire-1-M/bootstrap/5.1.3/css/bootstrap.min.css"
		  rel="stylesheet">
	<!-- 自定义样式 -->
	<style>
		/* 预览图片样式 */
		.preview-image {
			max-height: 50px;
			max-width: 100px;
			object-fit: cover;
		}

		/* 内容预览样式：3行文本溢出省略 */
		.content-preview {
			max-height: 100px;
			overflow: hidden;
			text-overflow: ellipsis;
			display: -webkit-box;
			-webkit-line-clamp: 3;
			-webkit-box-orient: vertical;
			color: #6c757d;
			font-size: 0.9rem;
		}
	</style>
</head>

<body>
<div class="container mt-4">
	<!-- 顶部导航栏 -->
	<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
		<div class="container-fluid">
			<a class="navbar-brand" href="/news/manage">新闻管理系统</a>
			<div class="d-flex">
					<span class="navbar-text me-3">
						欢迎，<span th:text="${session.admin.username}">管理员</span>
					</span>
				<a href="/admin/logout" class="btn btn-outline-danger">退出登录</a>
			</div>
		</div>
	</nav>

	<!-- 功能按钮区 -->
	<div class="mb-3">
		<a href="/news/add" class="btn btn-primary">添加新闻</a>
		<a href="/news/list" class="btn btn-secondary">查看新闻列表</a>
	</div>

	<!-- 新闻统计信息 -->
	<div class="mb-3">
		<p th:text="${'现有新闻总数: ' + #lists.size(newsList)}" class="text-muted"></p>
		<p th:if="${#lists.isEmpty(newsList)}" class="alert alert-info">暂无新闻数据</p>
	</div>

	<!-- 新闻列表表格 -->
	<div class="table-responsive">
		<table class="table table-striped table-hover">
			<thead class="table-dark">
			<tr>
				<th>ID</th>
				<th>标题</th>
				<th>作者</th>
				<th>预览</th>
				<th>创建时间</th>
				<th>最后编辑</th>
				<th>操作</th>
			</tr>
			</thead>
			<tbody>
			<!-- 新闻列表项 -->
			<tr th:each="news : ${newsList}">
				<td th:text="${news.id}">1</td>
				<td>
					<a th:href="@{'/news/view/' + ${news.id}}" th:text="${news.title}"
					   class="text-decoration-none">标题</a>
				</td>
				<td th:text="${news.author}">作者</td>
				<!-- 预览区：图片和内容 -->
				<td>
					<div class="d-flex align-items-center">
						<img th:if="${news.imageUrl}" th:src="@{'/' + ${news.imageUrl}}" th:alt="${news.title}"
							 th:title="${news.title}" class="preview-image me-2">
						<div class="content-preview" th:text="${news.content}">内容预览</div>
					</div>
				</td>
				<td th:text="${#dates.format(news.createTime, 'yyyy-MM-dd HH:mm')}">2024-01-01</td>
				<td th:text="${#dates.format(news.updateTime, 'yyyy-MM-dd HH:mm')}">2024-01-01</td>
				<!-- 操作按钮组 -->
				<td>
					<div class="btn-group">
						<a th:href="@{'/news/view/' + ${news.id}}" class="btn btn-sm btn-info">查看</a>
						<a th:href="@{'/news/edit/' + ${news.id}}" class="btn btn-sm btn-warning">编辑</a>
						<button onclick="deleteNews(this)" th:data-id="${news.id}"
								class="btn btn-sm btn-danger">删除</button>
					</div>
				</td>
			</tr>
			</tbody>
		</table>
	</div>
</div>

<!-- JavaScript 功能区 -->
<script>
	// 删除新闻处理函数
	function deleteNews(button) {
		if (!confirm('确定要删除这条新闻吗？')) return;

		const id = button.getAttribute('data-id');
		fetch('/news/delete/' + id, {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' }
		})
				.then(response => {
					if (!response.ok) throw new Error('Network response was not ok');
					return response.text();
				})
				.then(result => {
					if (result.includes('成功')) {
						// 删除成功后移除对应行并更新计数
						const row = button.closest('tr');
						if (row) {
							row.remove();
							updateNewsCount();
						}
						alert('删除成功');
					} else {
						alert(result);
					}
				})
				.catch(error => {
					console.error('Error:', error);
					alert('删除失败：' + error.message);
				});
	}

	// 更新新闻总数显示
	function updateNewsCount() {
		const countText = document.querySelector('.text-muted');
		if (countText) {
			const currentCount = document.querySelectorAll('tbody tr').length;
			countText.textContent = '现有新闻总数: ' + currentCount;
		}
	}
</script>
</body>

</html>
