<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<!-- 移动设备适配 -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- 使用新闻标题作为页面标题 -->
	<title th:text="${news.title}">新闻详情</title>
	<!-- 引入外部样式 -->
	<link href="https://lf26-cdn-tos.bytecdntp.com/cdn/expire-1-M/bootstrap/5.1.3/css/bootstrap.min.css"
		rel="stylesheet">
	<!-- 自定义样式 -->
	<style>
		/* 新闻图片样式 */
		.news-image {
			max-height: 400px;
			width: 100%;
			object-fit: contain;
		}

		/* 图片占位符样式 */
		.image-placeholder {
			width: 100%;
			height: 300px;
			background-color: #f8f9fa;
			display: flex;
			align-items: center;
			justify-content: center;
			border-radius: 0.25rem;
		}

		/* 占位符文本样式 */
		.placeholder-text {
			color: #6c757d;
			font-size: 1.2rem;
		}
	</style>
</head>

<body>
	<div class="container mt-4">
		<!-- 导航按钮 -->
		<div class="mb-3">
			<a href="/news/list" class="btn btn-secondary">返回列表</a>
		</div>

		<!-- 新闻内容区 -->
		<article class="mt-4">
			<!-- 新闻标题 -->
			<h1 class="mb-4" th:text="${news.title}">新闻标题</h1>

			<!-- 新闻信息 -->
			<div class="text-muted mb-4">
				<small>作者：<span th:text="${news.author}">作者</span></small><br>
				<small>创建时间：<span
						th:text="${#dates.format(news.createTime, 'yyyy-MM-dd HH:mm')}">创建时间</span></small><br>
				<small>最后修改：<span th:text="${#dates.format(news.updateTime, 'yyyy-MM-dd HH:mm')}">修改时间</span></small>
			</div>

			<!-- 新闻图片区域 -->
			<div class="mb-4 text-center">
				<!-- 有图片时显示图片 -->
				<div th:if="${news.imageUrl}">
					<img th:src="@{'/' + ${news.imageUrl}}" th:alt="${news.title}" th:title="${news.title}"
						class="news-image rounded">
				</div>
				<!-- 无图片时显示占位符 -->
				<div th:unless="${news.imageUrl}" class="image-placeholder">
					<span class="placeholder-text">暂无图片</span>
				</div>
			</div>

			<!-- 新闻正文 -->
			<div class="news-content">
				<p th:text="${news.content}" style="white-space: pre-line;">新闻内容</p>
			</div>
		</article>
	</div>
</body>

</html>
