<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<!-- 移动设备适配 -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- 使用新闻标题作为页面标题 -->
	<title th:text="${news.title}">新闻详情</title>
	<!-- 引入外部样式 -->
	<link href="https://lf26-cdn-tos.bytecdntp.com/cdn/expire-1-M/bootstrap/5.1.3/css/bootstrap.min.css"
		rel="stylesheet">
	<!-- 自定义样式 -->
	<style>
		.news-image {
			max-width: 100%;
			height: auto;
			margin: 20px 0;
		}
		
		.news-content {
			line-height: 1.8;
			margin: 20px 0;
		}
		
		.news-meta {
			color: #6c757d;
			margin-bottom: 20px;
		}
	</style>
</head>

<body>
	<div class="container mt-4">
		<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
			<div class="container-fluid">
				<a class="navbar-brand" href="/news/list">新闻列表</a>
				<div class="d-flex">
					<div th:if="${session.loginUser}">
						<span class="navbar-text me-3">
							欢迎，<span th:text="${session.loginUser}">用户</span>
						</span>
						<a href="/logout" class="btn btn-outline-danger">退出登录</a>
					</div>
					<div th:unless="${session.loginUser}">
						<a href="/login" class="btn btn-outline-primary">用户登录</a>
					</div>
				</div>
			</div>
		</nav>

		<div class="card">
			<div class="card-body">
				<h2 class="card-title" th:text="${news.title}">新闻标题</h2>
				<div class="news-meta">
					<span>作者：</span><span th:text="${news.author}">作者</span>
					<span class="mx-3">|</span>
					<span>发布时间：</span><span th:text="${#dates.format(news.createTime, 'yyyy-MM-dd HH:mm')}">时间</span>
				</div>
				
				<img th:if="${news.imageUrl}" th:src="@{'/' + ${news.imageUrl}}" class="news-image" 
					 th:alt="${news.title}" th:title="${news.title}">
				
				<div class="news-content" th:text="${news.content}">
					新闻内容
				</div>
				
				<div class="mt-4">
					<a href="/news/list" class="btn btn-primary">返回列表</a>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
