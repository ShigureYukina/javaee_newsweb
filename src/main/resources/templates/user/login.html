<!DOCTYPE html>
<html lang="zh">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>用户登录</title>
	<link href="https://lf26-cdn-tos.bytecdntp.com/cdn/expire-1-M/bootstrap/5.1.3/css/bootstrap.min.css"
		rel="stylesheet">
</head>

<body>
	<div class="container mt-5">
		<div class="row justify-content-center">
			<div class="col-md-4">
				<div class="card">
					<div class="card-header text-center">
						<h3>用户登录</h3>
					</div>
					<div class="card-body">
						<div th:if="${session.loginError}" class="alert alert-danger" th:text="${session.loginError}">
						</div>
						<form id="loginForm">
							<div class="mb-3">
								<label for="username" class="form-label">用户名</label>
								<input type="text" class="form-control" id="username" name="username" required>
							</div>
							<div class="mb-3">
								<label for="password" class="form-label">密码</label>
								<input type="password" class="form-control" id="password" name="password" required>
							</div>
							<button type="submit" class="btn btn-primary w-100">登录</button>
						</form>
						<div class="row mt-3">
							<div class="col-6">
								<a href="/user/register" class="btn btn-outline-secondary w-100">注册</a>
							</div>
							<div class="col-6">
								<a href="/admin/login" class="btn btn-outline-secondary w-100">管理员身份登录</a>
							</div>
							<div class="row mt-3"></div>
							<div class="col-12">
								<a href="/news/list" class="btn btn-secondary w-100">随便看看</a>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script>
		document.getElementById('loginForm').addEventListener('submit', function (e) {
			e.preventDefault();
			const formData = new FormData(this);
			fetch('/user/login', {
				method: 'POST',
				body: formData
			})
				.then(response => response.text())
				.then(result => {
					if (result === 'success') {
						location.href = '/news/list';
					} else {
						alert(result); // 显示错误信息
					}
				})
				.catch(error => {
					console.error('Error:', error);
					alert('登录失败：' + error);
				});
		});
	</script>
</body>

</html>
