<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>编辑用户</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://lf26-cdn-tos.bytecdntp.com/cdn/expire-1-M/bootstrap/5.1.3/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>
<div class="container mt-4">
    <h1>编辑用户</h1>

    <form id="editForm" class="mt-4">
        <input type="hidden" id="userId" th:value="${user.id}">

        <div class="mb-3">
            <label for="username" class="form-label">用户名</label>
            <input type="text" class="form-control" id="username" name="username" th:value="${user.username}" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">邮箱</label>
            <input type="email" class="form-control" id="email" name="email" th:value="${user.email}" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">密码</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="如果不修改密码请留空">
        </div>

        <div class="mb-3">
            <button type="submit" class="btn btn-primary">保存</button>
            <a href="/user/manage" class="btn btn-secondary">返回</a>
        </div>
    </form>
</div>

<script>
    document.getElementById('editForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const formData = new FormData();
        formData.append('id', document.getElementById('userId').value);
        formData.append('username', document.getElementById('username').value);
        formData.append('email', document.getElementById('email').value);
        
        const password = document.getElementById('password').value;
        if (password) {
            formData.append('password', password);
        }

        fetch('/user/edit', {
            method: 'POST',
            body: formData
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.text();
            })
            .then(result => {
                alert('更新成功');
                window.location.href = '/user/manage';
            })
            .catch(error => {
                console.error('Error:', error);
                alert('更新失败：' + error);
            });
    });
</script>
</body>

</html>
